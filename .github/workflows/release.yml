name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flac

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
            cross_pkg: ''
            linker: ''
          - target: aarch64-unknown-linux-gnu
            asset_suffix: linux-aarch64
            cross_pkg: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation linker
        if: matrix.cross_pkg != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.cross_pkg }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release assets
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          mkdir -p dist/stage
          BIN="target/${TARGET}/release/pipewire-recorder"
          if [ "${TARGET}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip "${BIN}"
          else
            strip "${BIN}"
          fi
          cp "${BIN}" "dist/pipewire-recorder-${SUFFIX}"
          cp "${BIN}" README.md config.example.yaml config.example.json dist/stage/
          tar -C dist/stage -czf "dist/pipewire-recorder-${TAG}-${SUFFIX}.tar.gz" .
          rm -rf dist/stage

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset_suffix }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
