[package]
name = "pipewire-recorder"
version = "0.1.0"
edition = "2024"
description = "Background PipeWire stream recorder with MPRIS metadata, cover art, completeness validation, and deduplication"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-lite = "2.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "net",
  "io-std",
  "io-util",
  "process",
  "time",
  "sync",
  "macros",
  "fs",
  "signal"
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zbus = "5.19.0"

[dev-dependencies]
tempfile = "3.27.0"
